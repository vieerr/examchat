<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESPE-Alert | Panel de Control</title>
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" />
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>ESPE<span>-Alert</span></h1>
      </div>
      <div class="header-center">
        <div id="clock"></div>
      </div>
      <div class="header-right">
        <button id="theme-toggle" title="Cambiar tema">☀</button>
      </div>
    </header>

    <main>
      <div class="alert-type-selector">
        <button class="type-btn active" data-type="CRITICA">&#128308; Crítica</button>
        <button class="type-btn" data-type="ADVERTENCIA">&#128993; Advertencia</button>
        <button class="type-btn" data-type="INFORMATIVA">&#128309; Informativa</button>
        <button class="type-btn" data-type="EVACUACION">&#128680; Evacuación</button>
      </div>

      <div class="send-panel">
        <input type="text" id="alert-input" placeholder="Describe la alerta o incidente..." autocomplete="off" />
        <button id="send-alert">Emitir Alerta</button>
      </div>

      <div class="alerts-container" id="alerts-list"></div>
    </main>

    <div id="alert-overlay" class="alert-overlay hidden">
      <div id="alert-overlay-inner">
        <div id="overlay-icon"></div>
        <div id="overlay-type"></div>
        <div id="overlay-user"></div>
        <div id="overlay-message"></div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
