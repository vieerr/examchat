<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESPE-Alert | Panel de Control</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #080808;
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: #111;
        border-bottom: 2px solid #cc0000;
        padding: 0 24px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .header-left h1 {
        font-size: 1.4rem;
        font-weight: 900;
        letter-spacing: 2px;
      }

      .header-left h1 span { color: #cc0000; }

      .status-dot {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 0.72rem;
        color: #4caf50;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .status-dot::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4caf50;
        animation: pulse-green 1.5s infinite;
      }

      @keyframes pulse-green {
        0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
        50% { box-shadow: 0 0 0 6px rgba(76,175,80,0); }
      }

      .header-right {
        font-size: 0.75rem;
        color: #666;
        letter-spacing: 1px;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: 960px;
        width: 100%;
        margin: 20px auto;
        padding: 0 16px;
        gap: 16px;
      }

      .alert-type-selector {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .type-btn {
        padding: 8px 18px;
        border-radius: 4px;
        border: 2px solid transparent;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.15s;
        background: #1a1a1a;
        color: #888;
        border-color: #2a2a2a;
      }

      .type-btn:hover { filter: brightness(1.3); }

      .type-btn.active {
        color: #fff;
      }

      .type-btn[data-type="CRITICA"].active { background: #cc0000; border-color: #cc0000; }
      .type-btn[data-type="ADVERTENCIA"].active { background: #e6a800; border-color: #e6a800; color: #000; }
      .type-btn[data-type="INFORMATIVA"].active { background: #1a73e8; border-color: #1a73e8; }
      .type-btn[data-type="EVACUACION"].active { background: #7b1fa2; border-color: #7b1fa2; }

      .send-panel {
        background: #111;
        border: 1px solid #222;
        border-radius: 8px;
        padding: 16px;
        display: flex;
        gap: 10px;
        align-items: stretch;
      }

      .send-panel input {
        flex: 1;
        background: #0a0a0a;
        border: 1px solid #333;
        border-radius: 6px;
        color: #fff;
        font-size: 0.95rem;
        padding: 12px 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      .send-panel input:focus { border-color: #cc0000; }
      .send-panel input::placeholder { color: #444; }

      .send-panel button {
        background: #cc0000;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 12px 22px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      .send-panel button:hover { background: #aa0000; }

      .alerts-container {
        background: #0f0f0f;
        border: 1px solid #1e1e1e;
        border-radius: 8px;
        flex: 1;
        min-height: 400px;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
      }

      .alerts-container:empty::before {
        content: "Sin alertas activas. El sistema está monitoreando...";
        color: #333;
        font-size: 0.85rem;
        text-align: center;
        margin: auto;
        letter-spacing: 1px;
      }

      .alerts-container::-webkit-scrollbar { width: 6px; }
      .alerts-container::-webkit-scrollbar-track { background: #111; }
      .alerts-container::-webkit-scrollbar-thumb { background: #cc0000; border-radius: 3px; }

      .alert-item {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 6px;
        border-left: 4px solid transparent;
        animation: slideIn 0.35s ease-out;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-16px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      .alert-item.CRITICA    { background: rgba(204,0,0,0.12);    border-color: #cc0000; }
      .alert-item.ADVERTENCIA { background: rgba(230,168,0,0.12); border-color: #e6a800; }
      .alert-item.INFORMATIVA { background: rgba(26,115,232,0.12); border-color: #1a73e8; }
      .alert-item.EVACUACION  { background: rgba(123,31,162,0.12); border-color: #7b1fa2; }
      .alert-item.GENERAL     { background: rgba(255,255,255,0.05); border-color: #555; }

      .alert-icon {
        font-size: 1.4rem;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .alert-body { flex: 1; }

      .alert-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 5px;
        flex-wrap: wrap;
      }

      .alert-type-tag {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 2px;
        padding: 2px 8px;
        border-radius: 2px;
        text-transform: uppercase;
      }

      .CRITICA    .alert-type-tag { background: #cc0000; color: #fff; }
      .ADVERTENCIA .alert-type-tag { background: #e6a800; color: #000; }
      .INFORMATIVA .alert-type-tag { background: #1a73e8; color: #fff; }
      .EVACUACION  .alert-type-tag { background: #7b1fa2; color: #fff; }
      .GENERAL     .alert-type-tag { background: #444; color: #fff; }

      .alert-user {
        color: #ccc;
        font-size: 0.8rem;
        font-weight: 600;
      }

      .alert-time {
        color: #555;
        font-size: 0.75rem;
        margin-left: auto;
      }

      .alert-message {
        color: #e0e0e0;
        font-size: 0.92rem;
        line-height: 1.5;
      }

      @media (max-width: 600px) {
        .alert-type-selector { gap: 6px; }
        .send-panel { flex-direction: column; }
        .send-panel button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <h1>ESPE<span>-Alert</span></h1>
        <div class="status-dot">Sistema Activo</div>
      </div>
      <div class="header-right" id="clock"></div>
    </header>

    <main>
      <div class="alert-type-selector">
        <button class="type-btn active" data-type="CRITICA">&#128308; Crítica</button>
        <button class="type-btn" data-type="ADVERTENCIA">&#128993; Advertencia</button>
        <button class="type-btn" data-type="INFORMATIVA">&#128309; Informativa</button>
        <button class="type-btn" data-type="EVACUACION">&#128680; Evacuación</button>
      </div>

      <div class="send-panel">
        <input type="text" id="alert-input" placeholder="Describe la alerta o incidente..." autocomplete="off" />
        <button id="send-alert">Emitir Alerta</button>
      </div>

      <div class="alerts-container" id="alerts-list"></div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
